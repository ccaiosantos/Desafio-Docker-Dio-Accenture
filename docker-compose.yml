version: '3'

services:
  web1:
    image: webdevops/php-apache:alpine-php7
    ports:
      - "4501:80"
    volumes:
      - ./php:/app

  web2:
    image: webdevops/php-apache:alpine-php7
    ports:
      - "4502:80"
    volumes:
      - ./php:/app

  web3:
    image: webdevops/php-apache:alpine-php7
    ports:
      - "4503:80"
    volumes:
      - ./php:/app

  db:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: Senha123
      MYSQL_DATABASE: meubanco
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  proxy:
    image: nginx:alpine
    ports:
      - "4500:4500"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - web1
      - web2
      - web3

volumes:
  db_data: